name: Deploy to EC2

on:
  push:
    branches:
      - mew/ranking-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/celllinefinder

            # Pull latest code
            git fetch origin mew/ranking-v2
            git checkout mew/ranking-v2
            git pull origin mew/ranking-v2

            # Backend: install any new dependencies
            cd backend_api
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            deactivate
            cd ..

            # Frontend: install deps + rebuild
            cd frontend
            npm install
            npm run build
            cd ..

            # Restart backend service
            sudo systemctl restart celllinefinder

            # Verify
            sleep 3
            curl -sf http://localhost:8000/health || echo "WARNING: Backend health check failed"
            echo "Deployment complete!"
